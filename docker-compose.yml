# docker compose up -d --build        -> Kafka, ClickHouse, sinkronisasi kamus, producer, consumer
# docker compose --profile ui up -d   -> ditambah Kafka UI di http://localhost:8080
x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:9092
  CH_HOST: clickhouse
  CH_PORT: "8123"
  CH_USER: apptag
  CH_PASSWORD: apptag          # hanya untuk demo lokal; semua port terikat ke 127.0.0.1
  CH_DB: apptag

services:
  kafka:
    image: apache/kafka:4.1.2   # Apache Kafka resmi, mode KRaft (tanpa ZooKeeper)
    hostname: kafka
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    ports: ["127.0.0.1:${CH_HTTP_PORT:-8124}:8123"]   # 8124 di host: 8123 sering sudah dipakai ClickHouse lain
    environment:
      CLICKHOUSE_USER: apptag
      CLICKHOUSE_PASSWORD: apptag
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync:                         # sekali saat start: kamus versi pertama dari commit v2fly terbaru
    build: .
    command: ["-v", "sync"]
    environment: *app-env
    depends_on: {clickhouse: {condition: service_healthy}}
    restart: "no"

  sync-scheduler:               # lalu setiap 6 jam; consumer memuat versi baru tanpa restart
    build: .
    command: ["-v", "sync", "--every", "21600"]
    environment: *app-env
    depends_on: {sync: {condition: service_completed_successfully}}
    restart: unless-stopped

  producer:
    build: .
    command: ["produce", "--n", "5000000", "--rate", "300"]
    environment: *app-env
    depends_on: {kafka: {condition: service_healthy}, sync: {condition: service_completed_successfully}}
    restart: unless-stopped

  consumer:
    build: .
    command: ["-v", "consume", "--reload-every", "30"]
    environment: *app-env
    depends_on: {kafka: {condition: service_healthy}, sync: {condition: service_completed_successfully}}
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["ui"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}

volumes:
  kafka-data:
  clickhouse-data:
