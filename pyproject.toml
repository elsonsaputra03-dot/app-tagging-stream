[project]
name = "app-tagging-stream"
version = "0.1.0"
description = "Streaming app tagging: Kafka hostname events tagged to applications and categories into ClickHouse, with a versioned dictionary from public lists."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["confluent-kafka>=2.4", "clickhouse-connect>=0.7", "pyyaml>=6.0", "tldextract>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
apptag = "apptag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apptag"]
